<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CODE TALK ARENA</title><style>*{box-sizing:border-box}body{margin:0;background:#eef4fa;color:#172c48;font-family:system-ui,sans-serif}main{max-width:1000px;margin:auto;padding:24px}h1{margin:0;font-size:38px;letter-spacing:-2px}header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px}button,select{font:inherit;border:0;border-radius:10px;padding:10px 14px;cursor:pointer}button{background:#173e69;color:white}select{background:white}#layout{display:grid;grid-template-columns:minmax(0,600px) 1fr;gap:22px;margin-top:18px}#board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:#233e60;padding:10px;border-radius:16px;aspect-ratio:1} .area{position:relative;display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:6px;background:#d4dfeb;border-radius:9px;min-width:0}.area.active{background:#ffe09a;box-shadow:inset 0 0 0 3px #f4ae24}.area:before{content:attr(data-n);position:absolute;top:2px;left:5px;font-size:10px;color:#526579;pointer-events:none}.cell{padding:0;background:#f8fbff;color:#8494a5;border-radius:50%;aspect-ratio:1;min-width:0;display:grid;place-items:center;font-size:clamp(10px,2vw,17px);border:2px solid transparent}.cell:disabled{cursor:default;opacity:.65}.cell.occupied{opacity:1;color:white;box-shadow:inset 0 -4px 0 #0002;font-weight:bold}.cell.win{border:3px solid #fff;outline:3px solid #ffbf00;opacity:1}.panel{background:white;padding:18px;border-radius:16px;margin-bottom:12px}#status{font-size:21px;font-weight:800} .player{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.dot{width:22px;height:22px;border-radius:50%;display:inline-block}.muted{color:#61758a;font-size:14px;line-height:1.7}#log{max-height:130px;overflow:auto;font-size:13px;line-height:1.7} @media(max-width:720px){main{padding:12px}#layout{grid-template-columns:1fr}#board{gap:5px;padding:6px}.area{gap:2px;padding:4px}h1{font-size:30px}}body{background:#101e36;color:#edf5ff}.panel{background:#203450}.muted{color:#b8cce4}button{background:#3267ad}button:disabled{cursor:default}input,select{font:inherit;padding:12px;border-radius:8px;border:1px solid #b9c9dd}#menu{max-width:650px;margin:40px auto} .mode{display:block;width:100%;text-align:left;padding:24px;margin:12px 0;font-size:22px;font-weight:bold}.mode small{display:block;font-size:14px;font-weight:normal;margin-top:8px}.area{padding-top:17px}.area:before{font-weight:bold}.cell{width:100%} [hidden]{display:none!important} #error{color:#ffb5a8;min-height:24px} .player{border-color:#40536b}.choices{display:inline-flex;gap:8px;flex-wrap:wrap;margin-left:12px}.choice{background:#344760;border:2px solid #7185a0;color:white}.choice[aria-pressed=true]{background:#f6d365;color:#14243b;border-color:#fff;font-weight:800;box-shadow:0 0 0 2px #f6d365}.choice[aria-pressed=true]:before{content:"✓ ";}.name-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px;margin:12px 0}.name-grid label{display:grid;gap:6px;font-size:14px}.name-grid input{width:100%;min-width:0;background:#f5f8ff;color:#172c48}.name-title{margin:18px 0 4px;font-weight:bold}.swatches{display:flex;flex-wrap:wrap;gap:6px;margin:5px 0 12px}.swatch{width:36px;height:36px;padding:0;border:2px solid transparent;border-radius:50%;color:#102038;font-weight:bold}.swatch[aria-pressed=true]{border:3px solid white;outline:2px solid #f6d365}.swatch:disabled{opacity:.25}.colorlabel{font-size:13px;color:#b8cce4}#turnBanner{--turn:#7195bd;border:4px solid var(--turn);border-radius:16px;padding:16px 20px;margin-top:16px;background:#203450;text-align:center;box-shadow:0 0 18px color-mix(in srgb,var(--turn) 45%,transparent)}#turnMain{font-size:clamp(24px,4vw,40px);font-weight:900;color:white}#turnNext{font-size:16px;margin-top:6px;color:#e4edf9}.player.current{border:3px solid var(--turn);border-radius:10px;padding:12px;background:#14243b;font-weight:900;font-size:18px}.turnPulse{animation:turnPulse 1.5s ease-in-out infinite}@keyframes turnPulse{50%{box-shadow:0 0 24px 5px color-mix(in srgb,var(--turn) 70%,transparent)}}@media(prefers-reduced-motion:reduce){.turnPulse{animation:none}}</style><main><header><div><h1>CODE TALK <span style="color:#76baff">ARENA</span></h1><p class="muted">논리와 전략의 두뇌 대결</p></div><button onclick="location.reload()">메인 메뉴</button></header><section id="menu"><div class="panel"><label>내 이름 (AI·온라인) <input id="nick" maxlength="20" value="플레이어"></label><div id="myColors"></div><p>참가 인원 <input type="hidden" id="count" value="2"><span class="choices" role="group"><button type="button" class="choice" aria-pressed="true" onclick="choose('count',2,this)">2명</button><button type="button" class="choice" aria-pressed="false" onclick="choose('count',3,this)">3명</button><button type="button" class="choice" aria-pressed="false" onclick="choose('count',4,this)">4명</button></span></p><div class="name-title">친구와 대결 · 플레이어 이름</div><div id="nameFields" class="name-grid"></div><p>AI 난이도 <input type="hidden" id="difficulty" value="0"><span class="choices" role="group"><button type="button" class="choice" aria-pressed="true" onclick="choose('difficulty',0,this)">초급</button><button type="button" class="choice" aria-pressed="false" onclick="choose('difficulty',1,this)">중급</button><button type="button" class="choice" aria-pressed="false" onclick="choose('difficulty',2,this)">고급</button></span></p><button class="mode" onclick="local('ai')">🤖 인공지능 대결<small>나 VS AI · 1:1</small></button><button class="mode" style="background:#246c59" onclick="local('local')">👥 친구와 대결<small>한 컴퓨터에서 2~4명</small></button><button class="mode" style="background:#674ca0" onclick="connect('create')">🌐 온라인 게임방 만들기<small>각자의 컴퓨터에서 실시간 대결</small></button><input id="code" placeholder="6자리 방 코드" maxlength="6"> <button onclick="connect('join')">게임방 참가</button></div></section><section id="orderPanel" class="panel" hidden><h2>가위바위보 결과 · 게임 순서 설정</h2><p>가위바위보를 한 뒤 1등부터 차례대로 이름을 선택하세요.</p><div id="orderFields" class="name-grid"></div><p id="orderError" role="alert"></p><button onclick="confirmOrder()">순서 확정 및 게임 시작</button> <button onclick="resetOrder()">순서 다시 선택</button></section><p id="error" role="alert"></p><section id="game" hidden><div id="room" class="panel" hidden></div><div id="turnBanner" hidden><div id="turnMain" role="status" aria-live="polite"></div><div id="turnNext"></div></div><div id="layout"><div id="board"></div><aside><div class="panel"><div id="status" aria-live="polite"></div><p id="hint" class="muted"></p><div id="players"></div><button id="again" onclick="restart()">다시 대결</button></div><div class="panel"><b>게임 방법</b><p class="muted">첫 칩은 자유롭게 놓습니다. 이후 직전 칸 번호와 같은 영역에 놓습니다. 가로·세로·대각선으로 3개를 연결하면 승리합니다.</p></div><div class="panel"><b>진행 기록</b><div id="log"></div></div></aside></div></section></main><script>(function(root){const E={}; E.start=n=>({n,b:Array(81).fill(-1),turn:0,target:-1,stock:Array(n).fill(20),winner:-1,win:[],ended:false,log:[]}); E.legal=(s,i)=>Number.isInteger(i)&&i>=0&&i<81&&!s.ended&&s.b[i]<0&&s.stock[s.turn]>0&&(s.target<0||Math.floor(i/9)===s.target)&&s.b.slice(i%9*9,i%9*9+9).some(x=>x<0); E.moves=s=>s.b.map((_,i)=>i).filter(i=>E.legal(s,i)); const idx=(r,c)=>(Math.floor(r/3)*3+Math.floor(c/3))*9+r%3*3+c%3; const lines=[];for(let r=0;r<9;r++)for(let c=0;c<9;c++)for(let [a,b] of [[0,1],[1,0],[1,1],[1,-1]])if(r+2*a<9&&c+2*b>=0&&c+2*b<9)lines.push([idx(r,c),idx(r+a,c+b),idx(r+2*a,c+2*b)]); E.play=(s,i)=>{if(!E.legal(s,i))return null;s=JSON.parse(JSON.stringify(s));let p=s.turn;s.b[i]=p;s.stock[p]--;s.log.push([p,Math.floor(i/9)+1,i%9+1]);s.win=lines.find(l=>l.every(j=>s.b[j]===p))||[];if(s.win.length){s.winner=p;s.ended=true;return s} s.target=i%9;for(let k=0;k<s.n;k++){s.turn=s.order?s.order[(s.order.indexOf(s.turn)+1)%s.n]:(s.turn+1)%s.n;if(s.stock[s.turn])break}if(!E.moves(s).length)s.ended=true;return s}; E.ai=(s,d)=>{let m=E.moves(s);if(!m.length)return null;if(d===0)return m[Math.floor(Math.random()*m.length)];let p=s.turn;function score(t){if(t.winner===p)return 100000;if(t.winner>=0)return -100000;if(t.ended)return 0;return lines.reduce((v,l)=>{let a=l.filter(i=>t.b[i]===p).length,b=l.filter(i=>t.b[i]>=0&&t.b[i]!==p).length;return v+(b===0?a*a:0)-(a===0?b*b:0)},0)}return m.map(i=>{let t=E.play(s,i),v=score(t);if(d===2&&!t.ended){let replies=E.moves(t);v=Math.min(...replies.map(j=>score(E.play(t,j))))}return [i,v]}).sort((a,b)=>b[1]-a[1])[0][0]};if(typeof module!=='undefined')module.exports=E;else root.E=E})(globalThis);
</script><script>
const $=id=>document.getElementById(id),palette=['#368af2', '#ef5966', '#27b98c', '#e9b52c', '#a879ed', '#f28b39', '#ed75b5', '#38c9e8'], colorNames=['파랑','빨강','초록','노랑','보라','주황','분홍','하늘색']; let colors=palette.slice(0,4), savedColors=colors.slice(), myColor=palette[0];
function swatches(selected,used,change){let row=document.createElement('div');row.className='swatches';palette.forEach((c,i)=>{let b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=c;b.title=colorNames[i];b.setAttribute('aria-label',colorNames[i]);b.setAttribute('aria-pressed',String(c===selected));b.textContent=c===selected?'✓':'';b.disabled=used.includes(c);b.onclick=()=>change(c);row.append(b)});return row}
function myColors(){let box=$('myColors');box.replaceChildren();let label=document.createElement('div');label.className='colorlabel';label.textContent='내 칩 색상 (AI·온라인)';box.append(label,swatches(myColor,[],c=>{myColor=c;myColors()}))}let mode,s,names,me=0,code,token,poll,busy=false;const savedNames=Array.from({length:4},(_,i)=>'플레이어 '+(i+1));function cleanName(v,fallback){return String(v||'').trim().slice(0,20)||fallback}function nameFields(){const box=$('nameFields');box.replaceChildren();for(let i=0;i<+$('count').value;i++){let label=document.createElement('label'),caption=document.createElement('span'),input=document.createElement('input');caption.textContent='● 플레이어 '+(i+1);caption.style.color=savedColors[i];input.type='text';input.maxLength=20;input.value=savedNames[i];input.placeholder='이름 입력';input.setAttribute('aria-label','플레이어 '+(i+1)+' 이름');input.addEventListener('input',()=>savedNames[i]=input.value);label.append(caption,input,swatches(savedColors[i],savedColors.filter((_,j)=>j!==i&&j<+$('count').value),c=>{savedColors[i]=c;nameFields()}));box.append(label)}}function choose(id,value,button){$(id).value=String(value);for(const b of button.parentElement.querySelectorAll("button"))b.setAttribute("aria-pressed",String(b===button));if(id==='count'){let used=[];for(let i=0;i<value;i++){if(used.includes(savedColors[i]))savedColors[i]=palette.find(c=>!used.includes(c));used.push(savedColors[i])}nameFields();}}let orderNames=[],picked=[];
function openOrder(list){orderNames=list.slice();picked=[];$('menu').hidden=true;$('game').hidden=true;$('orderPanel').hidden=false;drawOrder()}
function drawOrder(){let box=$('orderFields');box.replaceChildren();orderNames.forEach((name,i)=>{let b=document.createElement('button');let rank=picked.indexOf(i);b.textContent=(rank>=0?(rank+1)+'순위 · ':'')+name;b.disabled=rank>=0;b.style.background=rank>=0?'#246c59':colors[i];b.onclick=()=>{picked.push(i);drawOrder()};box.append(b)});$('orderError').textContent=picked.map(i=>orderNames[i]).join(' → ')}
function resetOrder(){picked=[];drawOrder()}
async function confirmOrder(){if(picked.length!==orderNames.length){$('orderError').textContent='모든 플레이어의 순서를 선택하세요.';return}if(mode==='online'){if(busy)return;busy=true;try{update(await api('order',{order:picked}))}catch(e){$('orderError').textContent=e.message}finally{busy=false}}else{s=E.start(names.length);s.order=picked.slice();s.turn=s.order[0];show()}}
function show(){ $('orderPanel').hidden=true; $('menu').hidden=true;$('game').hidden=false;render() }function local(m){mode=m;let n=m==='ai'?2:+$('count').value;names=m==='ai'?[cleanName($('nick').value,'나'),'AI']:savedNames.slice(0,n).map((v,i)=>cleanName(v,'플레이어 '+(i+1)));colors=m==='ai'?[myColor,palette.find(c=>c!==myColor)]:savedColors.slice(0,n);if(m==='local'){openOrder(names);return} s=E.start(n);show()}async function api(action,extra={}){let r=await fetch('/api',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({action,code,token,...extra})});let x=await r.json();if(x.error)throw Error(x.error);return x}function update(x){({code,token,me,names,state:s,colors}=x);$('room').hidden=false;$('room').textContent='방 코드: '+code+'  |  '+names.length+'/'+x.n+'명  |  내 번호: '+(me+1);let share=document.createElement('button');share.textContent='초대 링크 복사';share.onclick=async()=>{let url=new URL(location.href);url.searchParams.set('room',code);try{await navigator.clipboard.writeText(url.href);share.textContent='복사 완료'}catch{prompt('초대 링크를 복사하세요',url.href)}};$('room').append(' ',share);if(!s&&x.ready&&me===0){if($('orderPanel').hidden)openOrder(names);$('game').hidden=false;return}show()}async function connect(action){try{mode='online';code=$('code').value.trim().toUpperCase();update(await api(action,{n:+$('count').value,name:cleanName($('nick').value,'플레이어'),color:myColor}));poll=setInterval(async()=>{if(busy)return;busy=true;try{update(await api('state'));$('error').textContent=''}catch(e){$('error').textContent=e.message}finally{busy=false}},600)}catch(e){$('error').textContent='온라인 접속 실패: '+e.message+' (서버에서 실행해야 합니다)'}}function render(){let board=$('board');board.innerHTML='';if(!s){$('turnBanner').hidden=true;$('again').disabled=true;$('status').textContent='친구 또는 순서 확정을 기다리는 중';$('hint').textContent='방 코드를 친구에게 알려주세요';$('players').replaceChildren(...names.map((n,i)=>{let d=document.createElement('div');d.className='player';d.style.color=colors[i];d.textContent='● '+n;return d}));return}let allowed=mode==='local'||s.turn===me;let banner=$('turnBanner'), active=!s.ended, own=active&&allowed, order=s.order||names.map((_,i)=>i), next=order.slice(order.indexOf(s.turn)+1).concat(order.slice(0,order.indexOf(s.turn)+1)).find(i=>s.stock[i]>0);banner.hidden=false;banner.style.setProperty('--turn',colors[s.ended&&s.winner>=0?s.winner:s.turn]||'#7195bd');banner.classList.toggle('turnPulse',own);let msg=s.ended?(s.winner<0?'무승부':'🏆 '+names[s.winner]+' 승리!'):mode==='local'?'▶ '+names[s.turn]+'님의 차례!':own?'▶ 지금 당신의 차례입니다! · '+names[s.turn]:'⏳ '+names[s.turn]+'님의 차례 · 기다려 주세요';if($('turnMain').textContent!==msg)$('turnMain').textContent=msg;$('turnNext').textContent=active&&next!==undefined?'다음 차례: '+names[next]:'';for(let a=0;a<9;a++){let area=document.createElement('div');area.className='area'+(!s.ended&&(s.target===a||s.target<0)?' active':'');area.dataset.n='영역 '+(a+1);for(let c=0;c<9;c++){let i=a*9+c,p=s.b[i],b=document.createElement('button');b.className='cell'+(p>=0?' occupied':'')+(s.win.includes(i)?' win':'');b.textContent=c+1;b.disabled=!allowed||!E.legal(s,i);if(p>=0)b.style.background=colors[p];b.onclick=()=>move(i);area.append(b)}board.append(area)}$('status').textContent=s.ended?(s.winner<0?'무승부':'🏆 '+names[s.winner]+' 승리!'):names[s.turn]+' 차례';$('hint').textContent=s.ended?'게임 종료':s.target<0?'자유롭게 선택하세요':(s.target+1)+'번 영역에 놓으세요';$('players').replaceChildren(...(s.order||names.map((_,i)=>i)).map((i,rank)=>{let n=names[i];let d=document.createElement('div');d.className='player';d.style.color=colors[i];if(s.turn===i&&!s.ended){d.classList.add('current');d.style.setProperty('--turn',colors[i]);}d.textContent=(rank+1)+'순위 · '+n+(s.turn===i&&!s.ended?' ◀ 현재 차례':'')+' · '+s.stock[i]+'개 남음'+(mode==='online'&&i===me?' (나)':'');return d}));$('log').textContent=s.log.slice().reverse().map(([p,a,c])=>names[p]+' '+a+'-'+c).join(' / ');$('again').disabled=mode==='online'&&(!s.ended||me!==0)}async function move(i){if(busy)return;if(mode==='online'){busy=true;try{update(await api('move',{i}))}catch(e){$('error').textContent=e.message}finally{busy=false}return}let t=E.play(s,i);if(!t)return;s=t;render();if(mode==='ai'&&!s.ended&&s.turn===1){let snapshot=s;setTimeout(()=>{if(s!==snapshot)return;let j=E.ai(s,+$('difficulty').value);if(j!==null)s=E.play(s,j);render()},350)}}async function restart(){if(mode==='online'){if(busy)return;busy=true;try{update(await api('restart'))}catch(e){$('error').textContent=e.message}finally{busy=false}}else{if(mode==='local'){openOrder(names);return}s=E.start(s.n);render()}}nameFields();myColors();let invite=new URLSearchParams(location.search).get('room');if(invite)$('code').value=invite.toUpperCase();</script></html>
